<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardado</title>
</head>
<body>
    <style>
        .form {
            text-align: center;
            margin-top: 100px;
        }
    </style>



    {% if error %}
        <p>{{ error }}</p>
    {% else %}
        <form action="/login/" method="post">
        {% csrf_token %}
        <h1>¡Cuenta creada!</h1>
        <input type="submit" value="Iniciar sesión">
    </form>

    <form action="/datospersonales/" method="post">
        {% csrf_token %}
        <input type="submit" value="ver tus datos">
    </form>
    {% endif %}

    

</body>
</html>
