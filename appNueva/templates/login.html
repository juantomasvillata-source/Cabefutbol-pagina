{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  
    
</head>
<body>

    <style>
        body {
            background-color: green;
            background-size: cover;
            color: black;
        }

        body img {
            margin-top: -100px;
            
        }


        .contenedor {
            text-align: center;
            margin-top: 100px;
            font-style: oblique;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .registro {
            text-align: center;
            margin: 50px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% static 'images/LOGOJUEGO.png' %}">LOGO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">desarrollo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">información</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
  

    <div class="contenedor"> 
        <img src="{% static 'images/LOGOJUEGO.png' %}" alt="logo" width="200" height="100">
        <h1>INICIAR SESIÓN</h1>
        <form action="/login/" method="post">
            {% csrf_token %}
            <label>Correo electrónico</label>
            <br>
            <input type="email" name="correo" required>
            <br><br>
            <label>Contraseña</label>
            <br>
            <input type="password" name="contrasena" required>
            <br><br>
            <input type="submit" value="Confirmar">
        </form>

    <div class="registro">
        <p>¿No tenés una cuenta? Create una gratis!</p>
            <a href='/signup/'>
                {% csrf_token %}
                <input type="submit" value="Crear cuenta">
            </form>
    </div>

</body>
</html>
